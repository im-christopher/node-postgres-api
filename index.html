<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <h1>📌 Gestión de Usuarios</h1>

        <div class="form-group">
            <label for="name">Nombre:</label>
            <input type="text" id="name" placeholder="Ingresa tu nombre">
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Ingresa tu correo">
        </div>

        <div class="form-group">
            <label for="age">Edad:</label>
            <input type="number" id="age" placeholder="Ingresa tu edad">
        </div>

        <div class="buttons">
            <button onclick="postUser()">✅ Agregar Usuario</button>
            <button onclick="getUsers()">🔍 Ver Usuarios</button>
        </div>

        <h2>📋 Lista de Usuarios</h2>
        <div id="resultado" class="user-table"></div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="callrestapi.js"></script>

</body>
</html>
